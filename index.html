<!doctype html>
<html lang="ru" data-platform="standalone">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244b48"><meta name="description" content="Зажгите три вечерних района: 60 спокойных головоломок с проводами и домами.">
<title>Зажги квартал</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23244b48'/%3E%3Cpath d='m27 7-15 21h11l-3 13 16-23H25z' fill='%23ffda83'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="engine.js" defer></script><script src="levels.js" defer></script><script src="art.js" defer></script><script src="i18n.js" defer></script><script src="store.js" defer></script><script src="platform.js" defer></script><script src="release-config.js" defer></script><script src="district-art.js" defer></script><script src="game.js" defer></script>
</head>
<body>
<div id="boot" class="boot" role="status"><span>☾</span><h1>Зажги квартал · Light the Block</h1><p>Зажигаем фонари… / Lighting the lamps…</p></div>
<div class="shell" id="app" hidden>
<header class="site-header"><button class="brand" data-action="districts"><span class="brand-mark" data-icon="bolt"></span><span data-t="brand">Зажги квартал</span></button><div class="header-actions"><button id="sound" class="icon-button" data-action="sound"></button><button class="icon-button" id="settings" data-action="settings" data-icon="help"></button></div></header>
<nav class="navigation"><button id="campaign-nav" data-action="levels" data-t="levels"></button><button id="town-nav" data-action="districts" data-t="town"></button><button id="daily-nav" data-action="daily" data-t="daily"></button></nav>
<main class="game-layout">
<section class="puzzle-panel" aria-labelledby="level-title">
<div class="level-heading"><div><p class="eyebrow" id="level-number"></p><h1 id="level-title"></h1></div><span id="house-counter" class="house-counter" aria-live="polite"></span></div>
<p id="level-caption"></p>
<div class="board-area"><div class="board-frame"><div class="col-labels" id="col-labels" aria-hidden="true"></div><div class="row-labels" id="row-labels" aria-hidden="true"></div><div id="board" class="board"></div></div></div>
<div class="feedback"><p id="lesson" class="lesson"></p><div id="puzzle-actions" class="puzzle-actions"><button id="undo" data-action="undo"></button><button id="restart" data-action="restart"></button><button id="hint" class="hint-button" data-action="hint"></button></div><div id="victory" class="victory" hidden aria-live="polite"></div></div>
<div class="puzzle-meta"><span id="moves"></span><span id="save-status" aria-live="polite"></span></div>
</section>
<aside class="neighborhood"><div class="town-card"><div class="town-top"><span class="eyebrow" id="district-name"></span><span>☾</span></div><div id="town" class="town-art"></div><div class="town-copy"><h2 id="town-title"></h2><p id="town-caption"></p><div class="progress-label"><span data-t="warmLights"></span><strong id="district-progress"></strong></div><div class="progress-track"><span id="progress-fill"></span></div><div id="milestones" class="milestones"></div><button class="wide" data-action="districts" data-t="viewTown"></button></div></div><p class="quiet-note" data-t="quiet"></p></aside>
</main><div id="pause-cover" hidden role="status"></div><p id="toast" hidden role="status"></p>
</div>
<dialog id="modal"><button class="modal-close icon-button" id="modal-close" data-action="close" data-icon="close"></button><div id="modal-content"></div></dialog>
<noscript>Для игры нужен JavaScript. / Enable JavaScript to play.</noscript>
</body></html>
